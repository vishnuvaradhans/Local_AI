<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Local Neural Chat</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark">AI</div>
        <div>
          <h1>Neural Chat</h1>
          <p>Local Ollama assistant</p>
        </div>
      </div>

      <button class="new-chat-btn" id="newChatBtn">+ New Chat</button>

      <div class="sidebar-section">
        <div class="section-label">Chats</div>
        <div class="chat-list" id="chatList"></div>
      </div>
    </aside>

    <main class="chat-panel">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menuBtn" aria-label="Toggle sidebar">☰</button>
        <div>
          <h2>Local AI Console</h2>
          <p id="modelLabel">Model: checking...</p>
        </div>
        <div class="status-pill" id="statusPill">
          <span class="status-dot"></span>
          <span id="statusText">Checking Ollama</span>
        </div>
      </header>

      <section class="messages" id="messages">
        <div class="welcome">
          <div class="orb"></div>
          <h3>Ask anything. Your chat stays on this machine.</h3>
          <p>Connects to a local Ollama model through a lightweight Flask API.</p>
        </div>
      </section>

      <form class="composer" id="chatForm">
        <button type="button" class="clear-btn" id="clearBtn">Clear</button>
        <textarea
          id="messageInput"
          rows="1"
          placeholder="Message your local AI..."
          autocomplete="off"
        ></textarea>
        <button type="submit" class="send-btn" id="sendBtn">Send</button>
      </form>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
